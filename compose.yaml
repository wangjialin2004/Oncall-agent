name: super-biz-agent

services:
  backend:
    build:
      context: .
      dockerfile: deploy/compose/Dockerfile.backend
    env_file:
      - .env
    environment:
      HOST: 0.0.0.0
      PORT: "9900"
      REDIS_ENABLED: "true"
      REDIS_URL: redis://redis:6379/0
      MILVUS_HOST: milvus
      MILVUS_PORT: "19530"
      PROMETHEUS_BASE_URL: http://prometheus:9090
      # This stack does not ship the optional CLS/Monitor MCP servers. Set
      # HARNESS_MCP_ENABLED=true only after adding those services and URLs.
      HARNESS_MCP_ENABLED: "false"
      STATIC_SERVE_ENABLED: "false"
      MEMORY_DB_PATH: /app/volumes/long_term_memory.db
      CHECKPOINT_DB_PATH: /app/volumes/checkpoints.db
      STORAGE_LOCAL_ROOT: /app/volumes/file_storage
      STORAGE_CACHE_DIR: /app/volumes/file_storage/_cache
    ports:
      - "9900:9900"
    volumes:
      # Reuse the repository's existing SQLite/file-storage data. A named
      # volume here would silently create a new empty conversation database.
      - ./volumes:/app/volumes
    depends_on:
      redis:
        condition: service_healthy
      milvus:
        condition: service_healthy
    healthcheck:
      test:
        ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:9900/health/readiness', timeout=5)"]
      interval: 30s
      timeout: 8s
      start_period: 45s
      retries: 5
    restart: unless-stopped

  frontend:
    build:
      context: .
      dockerfile: deploy/compose/Dockerfile.frontend
    ports:
      - "5173:80"
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5
    restart: unless-stopped

  etcd:
    image: quay.io/coreos/etcd:v3.5.18
    environment:
      ETCD_AUTO_COMPACTION_MODE: revision
      ETCD_AUTO_COMPACTION_RETENTION: "1000"
      ETCD_QUOTA_BACKEND_BYTES: "4294967296"
      ETCD_SNAPSHOT_COUNT: "50000"
    volumes:
      - etcd-data:/etcd
    command: >-
      etcd -advertise-client-urls=http://etcd:2379
      -listen-client-urls http://0.0.0.0:2379
      --data-dir /etcd
    healthcheck:
      test: ["CMD", "etcdctl", "endpoint", "health"]
      interval: 30s
      timeout: 20s
      retries: 5
    restart: unless-stopped

  minio:
    image: minio/minio:RELEASE.2023-03-20T20-16-18Z
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-minioadmin}
    volumes:
      - minio-data:/minio_data
    command: minio server /minio_data --console-address ":9001"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://127.0.0.1:9000/minio/health/live"]
      interval: 30s
      timeout: 10s
      retries: 5
    restart: unless-stopped

  milvus:
    image: milvusdb/milvus:v2.5.10
    command: ["milvus", "run", "standalone"]
    security_opt:
      - seccomp:unconfined
    environment:
      ETCD_ENDPOINTS: etcd:2379
      MINIO_ADDRESS: minio:9000
    volumes:
      - milvus-data:/var/lib/milvus
    ports:
      - "19530:19530"
    depends_on:
      etcd:
        condition: service_healthy
      minio:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://127.0.0.1:9091/healthz"]
      interval: 30s
      start_period: 90s
      timeout: 20s
      retries: 5
    restart: unless-stopped

  attu:
    image: zilliz/attu:v2.5
    profiles: [tools]
    ports:
      - "${ATTU_HOST_PORT:-8001}:3000"
    environment:
      MILVUS_URL: milvus:19530
    depends_on:
      milvus:
        condition: service_healthy
    restart: unless-stopped

  prometheus:
    image: quay.io/prometheus/prometheus:v2.54.1
    profiles: [monitoring]
    ports:
      - "${PROMETHEUS_HOST_PORT:-9091}:9090"
    volumes:
      - ./deploy/prometheus/prometheus.docker.yml:/etc/prometheus/prometheus.yml:ro
      - ./deploy/prometheus/alerts.yml:/etc/prometheus/alerts.yml:ro
      - prometheus-data:/prometheus
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped

volumes:
  redis-data:
  etcd-data:
  minio-data:
  milvus-data:
  prometheus-data:
