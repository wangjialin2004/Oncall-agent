name: ci-smoke

on:
  push:
    branches: [main, master]
  pull_request:

permissions:
  contents: read

jobs:
  smoke:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install package (dev)
        run: |
          python -m pip install -U pip
          pip install -e ".[dev]"
      - name: Prepare migrated SQLite schema
        run: |
          python - <<'PY'
          import shutil
          import sqlite3
          from pathlib import Path
          
          db = Path("volumes/long_term_memory.db")
          backup = Path("volumes/backups/2026-07-18/long_term_memory.db")
          backup.parent.mkdir(parents=True, exist_ok=True)
          if db.exists():
              shutil.copy2(db, backup)
          else:
              if backup.exists():
                  backup.unlink()
              with sqlite3.connect(backup):
                  pass
          PY
          python scripts/migrate_database.py up
      - name: Run ci-smoke tests
        env:
          DASHSCOPE_API_KEY: ci-smoke-dummy-key
        run: |
          python -m pytest \
            tests/test_m1_close_the_loop.py \
            tests/test_m1_w2_context_checkpoint.py \
            tests/test_m1_w3_replan_latency.py \
            tests/test_m1_w4_latency_exit.py \
            tests/test_harness_verifier.py \
            tests/test_harness_checkpoint.py \
            tests/test_context_integration.py \
            tests/test_api_authorization_matrix.py \
            tests/test_rag_tenant_scope.py \
            tests/test_database_migrations.py \
            -q --tb=line --no-cov
      - name: Static checks
        run: |
          python -m ruff check --select E9,F63,F7,F82 app tests scripts
          python -m compileall -q app scripts
      - name: Secret contract
        env:
          LLM_API_KEY: ci-smoke-dummy-key
          AUTH_TOKEN_SECRET: ci-smoke-random-secret
          AUTH_USERS: ci-user:ci-password
          PROMETHEUS_BASE_URL: http://127.0.0.1:9090
        run: python scripts/check_env_secrets.py --strict --env-file /dev/null

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci
      - name: Frontend tests
        working-directory: frontend
        run: npm test -- --run
      - name: Frontend build
        working-directory: frontend
        run: npm run build
